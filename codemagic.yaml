workflows:
  ios-altserver:
    name: Course Attendance Manager - iOS AltServer Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        GOOGLE_IOS_CLIENT_ID: $GOOGLE_IOS_CLIENT_ID

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS release archive
        script: flutter build ipa --release --no-codesign --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID

      - name: Package Runner.app as IPA for AltServer
        script: |
          rm -rf Payload Course-Attendance-Manager-AltServer.ipa
          mkdir -p Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Course-Attendance-Manager-AltServer.ipa

    artifacts:
      - Course-Attendance-Manager-AltServer.ipa
